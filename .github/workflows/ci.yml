name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check backend tests
      - name: Mypy
        run: mypy backend
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npx playwright test

  service:
    name: spring-boot service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prereq_it
          MYSQL_USER: prereq
          MYSQL_PASSWORD: prereq
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `test` runs on H2 with an in-process cache; `verify` adds the integration tests that need
      # the MySQL and Redis services above. The wrapper pins Maven itself, so the runner's
      # bundled version cannot drift away from what a contributor builds with locally.
      - run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          report=target/site/jacoco/jacoco.xml
          if [ ! -f "$report" ]; then
            echo "No JaCoCo report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("### Coverage\n")
          print("| Metric | Covered | Missed | % |")
          print("| --- | ---: | ---: | ---: |")
          for c in root.findall("counter"):
              t, cov, miss = c.get("type"), int(c.get("covered")), int(c.get("missed"))
              total = cov + miss
              pct = f"{100 * cov / total:.1f}" if total else "—"
              print(f"| {t.title()} | {cov} | {miss} | {pct} |")
          PY

      # Uploaded unconditionally: a red build is exactly when these are worth reading.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-reports
          path: |
            service/target/surefire-reports/
            service/target/failsafe-reports/
            service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
