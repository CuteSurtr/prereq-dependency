spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/prereq_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${MYSQL_USER:prereq}
    password: ${MYSQL_PASSWORD:prereq}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

prereq:
  seed:
    on-startup: false
